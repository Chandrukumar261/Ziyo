{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page.title }} — Ziyo{% endblock %}
{% block meta_description %}{{ page.meta_description }}{% endblock %}

{% block content %}
<div class="ziyo-container ziyo-section">
    <div style="max-width: 800px; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 56px;">
        <h1 style="font-size: 2.4rem; margin-bottom: 24px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 16px;">
            {{ page.title }}
        </h1>
        <div style="color: var(--text-secondary); line-height: 1.85; font-size: 1rem;">
            {{ page.content|linebreaks }}
        </div>
    </div>
</div>
{% endblock %}
