{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Address — Ziyo{% endblock %}

{% block content %}
<div class="ziyo-container ziyo-section">
    <div style="max-width: 480px; margin: 0 auto; background: var(--bg-surface); padding: 40px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); text-align: center;">
        <h1 style="font-size: 1.5rem; margin-bottom: 12px; color: #C62828;">Remove Address?</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 24px;">
            Are you sure you want to remove <strong>{{ address.full_name }} &mdash; {{ address.address_line_1 }}</strong>?
        </p>

        <form method="POST" style="display: flex; gap: 14px; justify-content: center;">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary" style="background-color: #C62828;">Yes, Remove</button>
            <a href="{% url 'accounts:address_list' %}" class="btn btn-outline">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
