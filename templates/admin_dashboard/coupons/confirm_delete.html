{% extends 'admin_dashboard/base.html' %}
{% load static %}

{% block page_heading %}Delete Coupon{% endblock %}

{% block content %}
<div class="admin-card" style="max-width: 500px; margin: 40px auto; text-align: center; padding: 40px;">
    <h3 style="font-size: 1.4rem; color: #C62828; margin-bottom: 12px;">Delete Coupon?</h3>
    <p style="color: var(--admin-text-muted); font-size: 0.95rem; margin-bottom: 24px;">
        Are you sure you want to delete coupon <strong>{{ coupon.code }}</strong>?
    </p>

    <form method="POST" style="display: flex; gap: 14px; justify-content: center;">
        {% csrf_token %}
        <button type="submit" class="admin-btn admin-btn-danger">Yes, Delete</button>
        <a href="{% url 'dashboard:coupon_list' %}" class="admin-btn admin-btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
