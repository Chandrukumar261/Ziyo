# ==========================================
# Nginx Reverse Proxy Configuration for Ziyo
# ==========================================

upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name ziyo.store www.ziyo.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ziyo.store www.ziyo.store;

    ssl_certificate /etc/letsencrypt/live/ziyo.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyo.store/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Request limits
    client_max_body_size 15M;

    # Block hidden files, dotfiles, .env, and version control files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Static Assets
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Media Uploads
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Application Reverse Proxy
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
